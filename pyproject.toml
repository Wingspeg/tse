[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pef"
version = "0.1.0"
description = "Privacy-Enhanced Federated Learning Framework: Shapley-guided noise + lattice-based collaborative folding proofs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Privacy-Enhanced Framework Authors" },
]
keywords = [
    "federated-learning",
    "differential-privacy",
    "shapley-value",
    "lattice-cryptography",
    "folding-protocol",
    "renyi-mutual-information",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "SciencePlots>=2.1.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
# Minimal CPU-only install (no CUDA, smaller torch).
cpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
# `pef` becomes a real CLI; subcommands live in pef.cli
pef = "pef.cli:app"

[project.urls]
"Homepage" = "https://github.com/your-org/privacy_enhanced_framework"
"Issues" = "https://github.com/your-org/privacy_enhanced_framework/issues"

# ---------------------------------------------------------------------------
# Hatchling build target — src/pef/ layout
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/pef"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pef",
    "README.md",
    "README.zh.md",
    "LICENSE",
    "CHANGELOG.md",
]

# ---------------------------------------------------------------------------
# Ruff — fast linter + formatter (replaces black+isort+flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible default rule set. Add E501 ignore below since line-length=100 is
# already enforced by the formatter.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length — handled by formatter
    "B008",  # function-call-in-default-arg (we use this for shared samplers)
    "E402",  # module-level import not at top — needed for matplotlib Agg backend
    "B904",  # raise-from — fine for our error surface
    # Research-code pragmatics: we re-export large config blocks via
    # ``from pef.config import *`` on purpose so individual functions can
    # stay declarative. Ruff flags the resulting F403/F405 noise.
    "F403",
    "F405",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests
"src/pef/visualization*.py" = ["E402"]  # matplotlib backend must be set first

[tool.ruff.lint.isort]
known-first-party = ["pef"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "gpu: requires a CUDA device",
    "slow: long-running tests (>10s)",
    "smoke: fast end-to-end smoke checks",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:scienceplots.*",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
# Don't enforce strict by default — too noisy for a research codebase.
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
